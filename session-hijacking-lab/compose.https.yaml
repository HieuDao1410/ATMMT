name: session-hijacking-lab-https

services:
  app:
    build:
      context: .
    env_file:
      - ./.local/tls/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: https
      LAB_TLS_KEY_STORE: file:/run/tls/localhost.p12
    ports:
      - "127.0.0.1:${LAB_HTTPS_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ./.local/tls/localhost.p12
        target: /run/tls/localhost.p12
        read_only: true
        bind:
          create_host_path: false
