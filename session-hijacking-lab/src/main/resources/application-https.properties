# No plaintext connector is added to this instance.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${LAB_TLS_KEY_STORE:file:./.local/tls/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${LAB_TLS_PASSWORD}
server.ssl.key-alias=session-lab
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.servlet.session.cookie.name=__Host-LABSESSION_HTTPS
server.servlet.session.cookie.secure=true
# One minute of inactivity is a demo setting, not a production recommendation.
server.servlet.session.timeout=1m
