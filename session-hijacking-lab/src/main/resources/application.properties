spring.application.name=session-hijacking-lab
spring.profiles.default=http-lab

# Both variants are local-only. Docker overrides the internal bind address.
server.address=127.0.0.1
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Local lab: account backoff, separate for each application process.
lab.security.login.max-failures=5
lab.security.login.window-seconds=300
lab.security.login.block-seconds=60
# Audit the real connection address, never untrusted forwarding headers.
server.forward-headers-strategy=none

# Do not expose exception details through the default error response.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
